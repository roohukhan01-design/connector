name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug and release APKs
        run: gradle -p android :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RoohuConnect-Android-APKs
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload Android build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RoohuConnect-Android-build-reports
          path: android/app/build/reports
          if-no-files-found: ignore
