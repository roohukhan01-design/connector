name: Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: node --check server.js && node --check main.js && node --check preload.js && node --check renderer/renderer.js
      - name: Run pairing protocol tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RoohuConnect-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
